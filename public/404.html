<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404</title>
<link rel="stylesheet" href="/auth.css">
</head>
<body>
<button class="ghost lang" id="langBtn">EN | МК</button>
<svg class="dead" viewBox="0 0 64 80" aria-label="Dead meerkat">
  <ellipse cx="32" cy="58" rx="13" ry="17" fill="#ffd60a"/>
  <ellipse cx="32" cy="60" rx="7" ry="11" fill="#fff1a8"/>
  <path d="M19 62 L8 70 M45 62 L56 70" stroke="#ffd60a" stroke-width="5" stroke-linecap="round"/>
  <circle cx="32" cy="30" r="12" fill="#ffe14d"/>
  <ellipse cx="20" cy="29" rx="3.5" ry="5" fill="#b38600"/>
  <ellipse cx="44" cy="29" rx="3.5" ry="5" fill="#b38600"/>
  <ellipse cx="26" cy="29" rx="5" ry="5.5" fill="#2a1a0c"/>
  <ellipse cx="38" cy="29" rx="5" ry="5.5" fill="#2a1a0c"/>
  <path d="M23.5 26.5 l5 5 m0 -5 l-5 5 M35.5 26.5 l5 5 m0 -5 l-5 5" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/>
  <ellipse cx="32" cy="36" rx="4" ry="3" fill="#fff1a8"/>
  <circle cx="32" cy="35" r="1.8" fill="#111"/>
  <path d="M27 40 q5 -3 10 0" stroke="#111" stroke-width="1.4" fill="none" stroke-linecap="round"/>
  <ellipse cx="49" cy="20" rx="3" ry="4" fill="none" stroke="#fa1e4e" stroke-width="1.5" transform="rotate(20 49 20)"/>
</svg>
<p class="big">404</p>
<h1><span data-t="title"></span></h1>
<p data-t="text"></p>
<a class="btn" href="/" data-t="home"></a>
<footer><span data-t="devBy"></span> <b data-t="devName"></b></footer>
<script>
const $ = (id) => document.getElementById(id);
const I18N = {
  en: { title: 'This meerkat is dead', text: "The page you're looking for doesn't exist (anymore).", home: 'Back to leaderboard', devBy: 'Developed by', devName: 'Dushko Sofronievski Meerkat' },
  mk: { title: 'Овој меркат е мртов', text: 'Страницата што ја барате не постои (повеќе).', home: 'Назад кон табелата', devBy: 'Развиено од', devName: 'Душко Софрониевски Меркат' }
};
let lang = localStorage.getItem('lang') === 'mk' ? 'mk' : 'en';
function applyLang() {
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-t]').forEach((el) => { el.textContent = I18N[lang][el.dataset.t]; });
  $('langBtn').textContent = lang === 'mk' ? 'МК | EN' : 'EN | МК';
}
$('langBtn').onclick = () => { lang = lang === 'en' ? 'mk' : 'en'; localStorage.setItem('lang', lang); applyLang(); };
applyLang();
</script>
</body>
</html>
