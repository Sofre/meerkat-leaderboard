<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MEERKAT GAMING LIVE LEADERBOARD</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:"Segoe UI",Arial,sans-serif;background:#0b0b10 radial-gradient(circle at 50% -10%,#3a0612 0,#0b0b10 55%) no-repeat;color:#eee;min-height:100vh}
  header{position:relative;padding:36px 12px 48px;text-align:center;background:linear-gradient(180deg,#14141d 0,#0b0b10 100%)}
  .happy{width:120px;height:auto;display:block;margin:0 auto 10px;filter:drop-shadow(0 0 14px #ffd60a88);animation:bob 2.5s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-8px) rotate(3deg)}}
  h1{margin:0;font-size:clamp(1.8rem,6vw,4rem);letter-spacing:6px;text-transform:uppercase;color:#fff;text-shadow:0 0 10px #fa1e4e,0 0 24px #fa1e4e}
  h1>span:first-child{color:#ffd60a;text-shadow:0 0 12px #ffd60a,0 0 30px #ffb300}
  #clock{margin-top:18px;font-size:clamp(1.4rem,4vw,2.6rem);font-weight:600;color:#ff6b8b;letter-spacing:1px;font-family:Consolas,monospace}
  main{max-width:900px;margin:0 auto 40px;padding:0 12px}
  .bar{display:flex;justify-content:flex-end;margin-bottom:28px}
  button{cursor:pointer;border:0;padding:8px 16px;font-weight:700;text-transform:uppercase;letter-spacing:1px;background:#fa1e4e;color:#fff;clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%);transition:.15s}
  button:hover{background:#ff4d73;box-shadow:0 0 14px #fa1e4e}
  button.danger{background:#5a0f1e}
  button.ghost{background:#2a2a36}
  .bar{align-items:center;gap:12px}
  #authBtn{width:52px;height:52px;padding:6px;border-radius:50%;clip-path:none;background:#16161f;border:2px solid #fa1e4e;box-shadow:0 0 12px #fa1e4e88}
  #authBtn.on{background:#fa1e4e}
  #authBtn svg{width:100%;height:100%;display:block}
  table{width:100%;border-collapse:separate;border-spacing:0;border-radius:20px;overflow:hidden;background:linear-gradient(160deg,#ffffff26 0,#ffffff0d 35%,#fa1e4e1a 100%);backdrop-filter:blur(14px);border:1px solid #ffffff30;box-shadow:inset 0 1px 0 #ffffff55,inset 0 -20px 40px #00000040,0 30px 60px -10px #000,0 20px 50px #fa1e4e44;animation:float 6s ease-in-out infinite;position:relative}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
  th,td{padding:11px 12px;text-align:left}
  th{background:linear-gradient(180deg,#ffffff30,#ffffff08);color:#ff6b8b;text-transform:uppercase;letter-spacing:2px;font-size:.85rem}
  td{background:transparent;border-top:1px solid #ffffff12}
  tr:nth-child(even) td{background:#ffffff08}
  tr:hover td{background:#fa1e4e22}
  td.rank{font-weight:800;width:60px}
  td.score{font-weight:800;color:#fa1e4e;font-family:Consolas,monospace;font-size:1.1rem}
  .gold td.rank{color:#ffd700;text-shadow:0 0 8px #ffd700}.silver td.rank{color:#c8c8d0}.bronze td.rank{color:#cd7f32}
  .guidelines{margin-top:38px;padding:clamp(20px,4vw,34px);border:1px solid #ffffff24;border-radius:22px;background:linear-gradient(135deg,#20141b 0%,#15151e 55%,#17130d 100%);box-shadow:0 18px 48px #0008,inset 0 1px 0 #ffffff18;position:relative;overflow:hidden}
  .guidelines::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:linear-gradient(#fa1e4e,#ffd60a)}
  .guidelines-heading{text-align:center;margin-bottom:24px}
  .guidelines-kicker{display:inline-block;margin-bottom:8px;color:#ffd60a;font-size:.75rem;font-weight:800;letter-spacing:3px;text-transform:uppercase}
  .guidelines h2{margin:0;color:#fff;font-size:clamp(1.5rem,4vw,2rem);letter-spacing:2px;text-transform:uppercase;text-shadow:0 0 16px #fa1e4e66}
  .guidelines-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
  .guideline-card{padding:20px;border:1px solid #ffffff18;border-radius:16px;background:#0b0b10a8}
  .guideline-card h3{display:flex;align-items:center;gap:10px;margin:0 0 16px;color:#ff6b8b;font-size:1rem;letter-spacing:1.5px;text-transform:uppercase}
  .guideline-card.rewards h3{color:#ffd60a}
  .guideline-icon{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:#fa1e4e20;font-size:1.15rem}
  .rewards .guideline-icon{background:#ffd60a20}
  .guideline-list{display:grid;gap:12px;margin:0;padding:0;list-style:none}
  .guideline-list li{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;color:#d4d4de;font-size:.95rem;line-height:1.55}
  .guideline-number{color:#ff6b8b;font-family:Consolas,monospace;font-weight:800}
  .rewards .guideline-number{color:#ffd60a}
  .guideline-note{margin:18px 0 0;padding:12px 14px;border-left:3px solid #ffd60a;border-radius:0 10px 10px 0;background:#ffd60a0d;color:#f4e9bd;font-size:.9rem;line-height:1.55}
  @media(max-width:640px){.guidelines-grid{grid-template-columns:1fr}.guideline-card{padding:17px}}
  input{padding:9px;border:1px solid #3a3a4a;border-left:3px solid #fa1e4e;background:#0b0b10;color:#fff;flex:1;min-width:120px;outline:0}
  input:focus{border-color:#fa1e4e;box-shadow:0 0 8px #fa1e4e88}
  footer{text-align:center;padding:24px 12px 40px;color:#9a9aab;letter-spacing:1px}
  footer b{color:#ffd60a;text-shadow:0 0 8px #ffb30088}
  .empty{text-align:center;padding:30px;color:#777}
</style>
</head>
<body>
<header>
  <svg class="happy" viewBox="0 0 64 80" aria-label="Happy meerkat">
    <ellipse cx="32" cy="58" rx="13" ry="17" fill="#ffd60a"/>
    <ellipse cx="32" cy="60" rx="7" ry="11" fill="#fff1a8"/>
    <path d="M19 56 L9 44 M45 56 L55 44" stroke="#ffd60a" stroke-width="5" stroke-linecap="round"/>
    <circle cx="32" cy="30" r="12" fill="#ffe14d"/>
    <ellipse cx="20" cy="29" rx="3.5" ry="5" fill="#b38600"/>
    <ellipse cx="44" cy="29" rx="3.5" ry="5" fill="#b38600"/>
    <ellipse cx="26" cy="29" rx="5" ry="5.5" fill="#2a1a0c"/>
    <ellipse cx="38" cy="29" rx="5" ry="5.5" fill="#2a1a0c"/>
    <circle cx="27.5" cy="27.5" r="2" fill="#fff"/>
    <circle cx="39.5" cy="27.5" r="2" fill="#fff"/>
    <ellipse cx="32" cy="36" rx="4" ry="3" fill="#fff1a8"/>
    <circle cx="32" cy="35" r="1.8" fill="#111"/>
    <path d="M26 39.5 q6 6 12 0" stroke="#111" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  </svg>
  <h1><span>MEERKAT</span> <span class="plain" data-t="title"></span></h1>
  <div id="clock"></div>
</header>
<main>
  <div class="bar"><button id="langBtn" class="ghost" title="Language / Јазик">EN | МК</button><button id="authBtn" title="Admin login" aria-label="Admin login"><svg viewBox="0 0 64 64" aria-hidden="true"><ellipse cx="32" cy="44" rx="13" ry="17" fill="#ffd60a"/><ellipse cx="32" cy="46" rx="7" ry="11" fill="#fff1a8"/><circle cx="32" cy="22" r="11" fill="#ffe14d"/><ellipse cx="21" cy="21" rx="3.5" ry="5" fill="#b38600"/><ellipse cx="43" cy="21" rx="3.5" ry="5" fill="#b38600"/><ellipse cx="26.5" cy="21" rx="4.5" ry="5" fill="#2a1a0c"/><ellipse cx="37.5" cy="21" rx="4.5" ry="5" fill="#2a1a0c"/><circle cx="27" cy="20" r="1.8" fill="#fff"/><circle cx="38" cy="20" r="1.8" fill="#fff"/><ellipse cx="32" cy="27" rx="4" ry="3" fill="#fff1a8"/><circle cx="32" cy="26" r="1.8" fill="#111"/></svg></button></div>
  <table>
    <thead><tr><th>#</th><th data-t="nickname"></th><th data-t="name"></th><th data-t="surname"></th><th data-t="score"></th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <section class="guidelines" aria-labelledby="guidelinesTitle">
    <div class="guidelines-heading">
      <span class="guidelines-kicker" data-t="guidelinesKicker"></span>
      <h2 id="guidelinesTitle" data-t="guidelinesTitle"></h2>
    </div>
    <div class="guidelines-grid">
      <article class="guideline-card">
        <h3><span class="guideline-icon" aria-hidden="true">⚡</span><span data-t="rulesTitle"></span></h3>
        <ol class="guideline-list">
          <li><span class="guideline-number">01</span><span data-t="ruleActive"></span></li>
          <li><span class="guideline-number">02</span><span data-t="ruleHelping"></span></li>
          <li><span class="guideline-number">03</span><span data-t="ruleProfessor"></span></li>
          <li><span class="guideline-number">04</span><span data-t="ruleDeductions"></span></li>
        </ol>
      </article>
      <article class="guideline-card rewards">
        <h3><span class="guideline-icon" aria-hidden="true">🏆</span><span data-t="rewardsTitle"></span></h3>
        <ol class="guideline-list">
          <li><span class="guideline-number">01</span><span data-t="rewardFirst"></span></li>
          <li><span class="guideline-number">02</span><span data-t="rewardPassDown"></span></li>
          <li><span class="guideline-number">03</span><span data-t="rewardMultiplayer"></span></li>
        </ol>
        <p class="guideline-note" data-t="rewardWildcard"></p>
      </article>
    </div>
  </section>
</main>
<footer><span data-t="devBy"></span> <b data-t="devName"></b></footer>
<script>
const $ = (id) => document.getElementById(id);
let players = [];
const token = sessionStorage.getItem('token');

const I18N = {
  en: { locale: 'en-US', devBy: 'Developed by', devName: 'Sofre | Meerkat', title: 'GAMING LIVE LEADERBOARD', nickname: 'Nickname', name: 'Name', surname: 'Surname', score: 'Score', actions: 'Actions',
    guidelinesKicker: 'Play fair · Earn points · Have fun', guidelinesTitle: 'Class Rules & Rewards', rulesTitle: 'How to earn points', ruleActive: 'Be active and take part in class to earn points.', ruleHelping: 'Help your friends out to earn points too.', ruleProfessor: 'Your professor decides how many points are awarded.', ruleDeductions: 'Points may be deducted for naughty behaviour or not following instructions. Your score can go below zero.', rewardsTitle: 'The PS5 is up for grabs', rewardFirst: 'First place gets to play on the PS5 after class.', rewardPassDown: 'If they pass, the chance goes to second place, then third place at most.', rewardMultiplayer: 'For a 2- or 3-player game, first place may automatically invite second and third place to join, or choose a wildcard player.', rewardWildcard: 'Wildcard rule: choosing a student below third place deducts points from first place. Wildcards are only for places below third; second and third place are not affected by this rule.',
    add: 'Add player', update: 'Update player', cancel: 'Cancel', edit: 'Edit', del: 'Delete', empty: 'No players yet',
    login: 'Admin login', logout: 'Admin logout', confirmDel: 'Delete this player?',
    unauthorized: 'Unauthorized', invalid: 'Nickname and numeric score required', notFound: 'Not found', error: 'Error' },
  mk: { locale: 'mk-MK', devBy: 'Развиено од', devName: 'Душко Софрониевски Меркат', title: 'ГЕЈМИНГ ЛИВ ЛИДЕРБОРД', nickname: 'Прекар', name: 'Име', surname: 'Презиме', score: 'Поени', actions: 'Акции',
    guidelinesKicker: 'Играј фер · Освојувај поени · Забавувај се', guidelinesTitle: 'Правила и награди', rulesTitle: 'Како се освојуваат поени', ruleActive: 'Биди активен и учествувај на час за да освојуваш поени.', ruleHelping: 'Помагај им на другарите за да освоиш поени.', ruleProfessor: 'Професорот одлучува колку поени се доделуваат.', ruleDeductions: 'Поени може да се одземат за непристојно однесување или непочитување на упатствата. Поените може да паднат и под нула.', rewardsTitle: 'Освои играње на PS5', rewardFirst: 'Играчот на прво место добива можност да игра на PS5 по часот.', rewardPassDown: 'Ако одбие, можноста преминува на второто, а најмногу до третото место.', rewardMultiplayer: 'За игра со 2 или 3 играчи, првопласираниот може автоматски да ги покани второто и третото место или да избере џокер-играч.', rewardWildcard: 'Правило за џокер: изборот на ученик под третото место одзема поени од првопласираниот. Џокер важи само за места под третото; второто и третото место не се засегнати.',
    add: 'Додади играч', update: 'Ажурирај играч', cancel: 'Откажи', edit: 'Измени', del: 'Избриши', empty: 'Сè уште нема играчи',
    login: 'Најава за админ', logout: 'Одјава на админ', confirmDel: 'Да се избрише овој играч?',
    unauthorized: 'Неовластен пристап', invalid: 'Потребни се прекар и бројчани поени', notFound: 'Не е пронајдено', error: 'Грешка' }
};
const SERVER_MSG = { 'Unauthorized': 'unauthorized', 'Nickname and numeric score required': 'invalid', 'Not found': 'notFound' };
let lang = localStorage.getItem('lang') === 'mk' ? 'mk' : 'en';
const t = (k) => I18N[lang][k];

const MK_DAYS = ['недела', 'понеделник', 'вторник', 'среда', 'четврток', 'петок', 'сабота'];
const MK_MONTHS = ['јануари', 'февруари', 'март', 'април', 'мај', 'јуни', 'јули', 'август', 'септември', 'октомври', 'ноември', 'декември'];

function tick() {
  const d = new Date();
  if (lang === 'mk') {
    const p = (n) => String(n).padStart(2, '0');
    $('clock').textContent = `${MK_DAYS[d.getDay()]}, ${d.getDate()} ${MK_MONTHS[d.getMonth()]} ${d.getFullYear()}, ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
  } else {
    $('clock').textContent = d.toLocaleString('en-US', { dateStyle: 'full', timeStyle: 'medium' });
  }
}
setInterval(tick, 1000);

function applyLang() {
  document.documentElement.lang = lang;
  document.title = 'MEERKAT ' + t('title');
  document.querySelectorAll('[data-t]').forEach((el) => { el.textContent = t(el.dataset.t); });
  document.querySelectorAll('[data-ph]').forEach((el) => {
    el.placeholder = t(el.dataset.ph) + (el.required ? ' *' : '');
  });
  $('langBtn').textContent = lang === 'mk' ? 'МК | EN' : 'EN | МК';
    tick(); render();
}
$('langBtn').onclick = () => { lang = lang === 'en' ? 'mk' : 'en'; localStorage.setItem('lang', lang); applyLang(); };

const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function render() {
  $('authBtn').title = t('login');
  const sorted = [...players].sort((a, b) => b.score - a.score);
  $('rows').innerHTML = sorted.length ? sorted.map((p, i) => `
    <tr class="${['gold', 'silver', 'bronze'][i] || ''}">
      <td class="rank">${i + 1}</td><td>${esc(p.nickname)}</td><td>${esc(p.firstName)}</td><td>${esc(p.surname)}</td>
      <td class="score">${esc(p.score)}</td>
    </tr>`).join('') : `<tr><td colspan="5" class="empty">${t('empty')}</td></tr>`;
}

async function load() {
  try {
    const res = await fetch('/api/players');
    players = await res.json(); render();
  } catch { /* keep the last data on screen */ }
}

$('authBtn').onclick = () => location.assign(token ? '/admin.html' : '/login.html');
applyLang(); load(); setInterval(load, 5000); // live refresh
</script>
</body>
</html>
